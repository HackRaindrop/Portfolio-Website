<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Jack Kirk Portfolio</title>
    <link rel="canonical" href="https://jackwkirk.com">
    <script>
        // GitHub Pages: send any old deep links to the new site
        var target = "https://jackwkirk.com";
        var path = window.location.pathname.replace(/^\/Portfolio-Website/, "") || "/";
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        location.replace(target + path + search + hash);
    </script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0d1117;
            color: #e8edf7;
        }

        a {
            color: #3dd6c6;
        }
    </style>
</head>

<body>
    <p>Portfolio moved to <a href="https://jackwkirk.com">jackwkirk.com</a>.</p>
</body>

</html>
